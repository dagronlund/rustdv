# Template: rustdv testbench crate manifest. Replace <names> and the two paths.
[package]
name = "<dut>_tb"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib: loaded by the simulator as a VPI module.
# rlib: lets `cargo test` run the pure-Rust unit tests.
crate-type = ["cdylib", "rlib"]

# Paths into your clone of the rustdv repository, relative to this file.
[dependencies]
rustdv = { path = "<path-to>/rustdv/rustdv" }

# Panicking vpi_* symbols so `cargo test` executables link. Never linked into
# the cdylib the simulator loads, where the real symbols come from the simulator.
[dev-dependencies]
rustdv-vpi-stubs = { path = "<path-to>/rustdv/rustdv/rustdv-vpi-stubs" }

# Not working from a clone? Run `cargo add rustdv` and
# `cargo add --dev rustdv-vpi-stubs` instead, and delete the two path lines
# above. Let cargo write those lines; a version typed by hand is wrong at the
# next release and nothing reminds you to fix it.
